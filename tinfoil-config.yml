# Tinfoil Container: attested Qwen3-Embedding-0.6B for the submission document engine.
#
# Lives at the root of the PUBLIC config repo OpacityLabs/kyb-embeddings-config together with
# the Dockerfile and .github/workflows from deploy/tinfoil/embeddings/ in kyb-kyc-services.
#
# The image is built by the Tinfoil Release workflow from that Dockerfile: Text Embeddings
# Inference (CPU) with the model weights baked in at commit 97b0c614… — the commit pinned by
# kyb.documents.embedding_models.QWEN3_EMBEDDING_0_6B (changing it is an engine profile
# change, see ADR-0027). The workflow rewrites the image digest below on the tagged release
# commit, so main keeps the placeholder and the measured release pins the exact bytes,
# weights included. No `models:` block is needed, so no wrapped artifact or host access.
#
# Release: Actions → "Tinfoil Release" → Run workflow → vX.Y.Z (both phases must finish).
# Deploy from the dashboard, then point the services at it:
#   KYB_SUBMISSION_EMBEDDING_ENCLAVE=<container-name>.<org>.containers.tinfoil.dev
#   KYB_SUBMISSION_EMBEDDING_CONFIG_REPO=OpacityLabs/kyb-embeddings-config
#
# Throughput on CPU is bounded; a 2,048-token chunk costs seconds on 8 cores. If a
# generation cannot index within KYB_SUBMISSION_INDEX_TIMEOUT_SECONDS, change the Dockerfile
# base image to the matching `cuda-1.9.4` tag, add top-level `gpus: 1`, and give the container
# `runtime: nvidia`, `gpus: all` and `ipc: host`.

cvm-version: "0.14.7"
cpus: 8
memory: 16384

containers:
  - name: "embeddings"
    # Placeholder on main; the release workflow substitutes the built digest at the tag.
    image: "ghcr.io/opacitylabs/kyb-embeddings:placeholder"
    command:
      - "--model-id"
      - "/models/qwen3-embedding-0.6b"
      - "--served-model-name"
      - "Qwen/Qwen3-Embedding-0.6B"
      - "--dtype"
      - "float32"
      - "--port"
      - "8001"
      # The image pins TEI's input bound to the engine's 2,048-token chunk budget (see the
      # Dockerfile); anything longer is refused instead of silently truncated. Batches hold
      # up to four maximal chunks.
      - "--auto-truncate"
      - "false"
      - "--max-batch-tokens"
      - "8192"
      - "--max-client-batch-size"
      - "64"
    tmpfs:
      /tmp: "size=1g"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10m

# No `networks` block: the container needs no egress. Only the paths below are reachable.
shim:
  upstream-port: 8001
  paths:
    - /v1/embeddings
    - /health
    - /info
