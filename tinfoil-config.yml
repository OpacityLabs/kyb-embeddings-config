# Tinfoil Container: attested Qwen3-Embedding-0.6B for the submission document engine.
#
# This file must live at the root of a PUBLIC GitHub config repo (Tinfoil measures it per tag).
# Copy it there, then:
#   1. tinfoil model wrap Qwen/Qwen3-Embedding-0.6B \
#        --commit 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3 --host <cpu-host> --wait
#      and paste the printed `mpk` value below. The commit is the one pinned in
#      kyb.documents.embedding_models (QWEN3_EMBEDDING_0_6B); changing it is an engine
#      profile change, see ADR-0027.
#   2. Replace MPK_ROOT_HASH in `command` with the root-hash prefix of that `mpk` value
#      (everything before the first underscore).
#   3. Commit, tag, run the Tinfoil Release workflow, and deploy from the dashboard.
#   4. Point the services at it:
#        KYB_SUBMISSION_EMBEDDING_ENCLAVE=<container-url>
#        KYB_SUBMISSION_EMBEDDING_CONFIG_REPO=<org>/<this repo>
#
# Serving runtime: Text Embeddings Inference (CPU). TEI reads last-token pooling from the
# model's 1_Pooling/config.json and serves the OpenAI-compatible /v1/embeddings the engine
# calls. Throughput on CPU is bounded; a 2,048-token chunk costs seconds on 8 cores. If a
# generation cannot index within KYB_SUBMISSION_INDEX_TIMEOUT_SECONDS, switch the image to
# the matching `cuda-1.9.4` tag, add top-level `gpus: 1`, and give the container
# `runtime: nvidia`, `gpus: all` and `ipc: host`.

cvm-version: "0.14.7"
cpus: 8
memory: 16384

models:
  - name: "qwen3-embedding-0.6b"
    repo: "Qwen/Qwen3-Embedding-0.6B@97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3"
    # Generated by `tinfoil model wrap`; keep exactly as printed.
    mpk: ""

containers:
  - name: "embeddings"
    # ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4 (multi-arch index digest;
    # the linux/amd64 manifest is sha256:8419f533857b503ebf6ec292a95d4f1cf9c0464ac8b8abeef39518cf110e5726)
    image: "ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d"
    command:
      - "--model-id"
      - "/tinfoil/mpk/mpk-MPK_ROOT_HASH"
      - "--served-model-name"
      - "Qwen/Qwen3-Embedding-0.6B"
      - "--dtype"
      - "float32"
      - "--port"
      - "8001"
      # The engine bounds chunks to 2,048 tokens and queries to the same; refuse to truncate
      # anything longer instead of silently changing what was embedded. TEI requires the
      # batch-token bound to cover the model's own maximum when truncation is off.
      - "--auto-truncate"
      - "false"
      - "--max-batch-tokens"
      - "32768"
      - "--max-client-batch-size"
      - "64"
    env:
      # Weights come from the verified artifact; never reach for the Hub.
      - HF_HUB_OFFLINE: "1"
      - HF_HOME: "/tmp/hf"
    tmpfs:
      /tmp: "size=1g"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10m

# No `networks` block: the container needs no egress. Only the paths below are reachable.
shim:
  upstream-port: 8001
  paths:
    - /v1/embeddings
    - /health
    - /info
